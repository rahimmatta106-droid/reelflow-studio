# ReelFlow Studio — Free cloud APK build (GitHub Actions)
# Push this repo to GitHub → Actions builds the APK automatically → download it.
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0"

      # FIXED debug keystore: every build signs with the SAME key, so updates
      # install cleanly over the previous version (no "package appears to be
      # invalid" / signature-mismatch errors, no data loss from uninstalls).
      - name: Install fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          ls -la ~/.android/debug.keystore

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelFlow-Studio-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
