version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: autoreels_postgres
    restart: always
    environment:
      POSTGRES_DB: autoreels_db
      POSTGRES_USER: autoreels_user
      POSTGRES_PASSWORD: secure_dev_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql

  redis:
    image: redis:7-alpine
    container_name: autoreels_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: autoreels_api
    restart: always
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://autoreels_user:secure_dev_password_2026@db:5432/autoreels_db
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      APP_URL: ${APP_URL:-http://localhost:8000}

volumes:
  pgdata:
